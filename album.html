<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --text: #e8e4dc;
    --muted: #6b6560;
    --accent: #c8b89a;
    --border: #1e1e1e;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Montserrat', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.34;
  }
  a { color: inherit; }
  .wrap {
    min-height: 100vh;
    display: grid;
    gap: 28px;
    padding: 28px 48px 40px;
    justify-items: center;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: center;
    width: min(100%, 1120px);
  }
  .back-link {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--accent);
  }
  .back-link:hover { color: var(--text); }
  .album-meta {
    display: grid;
    gap: 10px;
    max-width: 760px;
  }
  .album-kicker {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(40px, 7vw, 84px);
    font-weight: 300;
    font-style: italic;
    line-height: 0.95;
  }
  .subtitle {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.8;
  }
  .stage {
    position: relative;
    width: min(100%, 1120px);
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(17,17,17,0.96), rgba(10,10,10,0.96));
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.18);
  }
  .carousel {
    width: 100%;
    padding: 18px 18px 8px;
  }
  .track {
    display: flex;
    transition: transform 0.45s ease;
    will-change: transform;
    align-items: center;
  }
  .slide {
    min-width: 100%;
    width: 100%;
    background: #050505;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .slide img {
    width: auto;
    height: auto;
    max-width: min(100%, 1040px);
    max-height: min(72svh, 760px);
    display: block;
    background: #050505;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 48px;
    height: 48px;
    border: 1px solid rgba(200,184,154,0.45);
    background: rgba(10,10,10,0.28);
    color: var(--text);
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .nav-btn:hover { background: rgba(200,184,154,0.18); }
  .nav-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .nav-btn.prev { left: 16px; }
  .nav-btn.next { right: 16px; }
  .nav-btn svg { width: 16px; height: 16px; }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding-top: 6px;
    width: min(100%, 1120px);
  }
  .count {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(200,184,154,0.45);
    background: transparent;
    cursor: pointer;
  }
  .dot.active {
    background: var(--accent);
  }
  .empty {
    padding: 40px;
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
  }
  .not-found {
    min-height: 70vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }
  .not-found-card {
    width: min(560px, 100%);
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(17,17,17,0.96), rgba(10,10,10,0.96));
    padding: 28px;
  }
  .not-found-card h2 {
    font-family: var(--serif);
    font-size: 38px;
    font-weight: 300;
    font-style: italic;
    margin-bottom: 10px;
  }
  .not-found-card p {
    font-size: 12px;
    line-height: 1.9;
    color: var(--muted);
  }
  @media (max-width: 900px) {
    .wrap { padding: 18px 16px 28px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .stage, .topbar, .bar { width: 100%; }
    .carousel { padding: 12px 12px 6px; }
    .slide img { max-width: 100%; max-height: min(62svh, 560px); }
    .nav-btn { width: 40px; height: 40px; }
    .nav-btn.prev { left: 10px; }
    .nav-btn.next { right: 10px; }
    .bar { flex-direction: column; align-items: flex-start; }
    .dots { justify-content: flex-start; }
  }
</style>
</head>
<body>
  <main id="app"></main>

  <script>
    (function albumPage() {
      const storageKey = 'zbz-photo-albums-v1';
      const catalogPath = 'Photo Albums/albums.json';
      const app = document.getElementById('app');
      const params = new URLSearchParams(window.location.search);
      const albumId = params.get('id');

      const readAlbums = () => {
        try {
          const raw = localStorage.getItem(storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter(item => item && item.id && item.section && item.title) : [];
        } catch {
          return [];
        }
      };

      const normalizeAlbum = (album) => {
        if (!album || !album.id || !album.section || !album.title) return null;
        return {
          id: String(album.id),
          section: String(album.section),
          title: String(album.title),
          subtitle: String(album.subtitle || ''),
          folder: String(album.folder || album.path || '').trim(),
          cover: String(album.cover || album.coverFile || album.coverImage || '').trim(),
          photos: Array.isArray(album.photos) ? album.photos.map(item => String(item || '').trim()).filter(Boolean) : [],
        };
      };

      const loadRemoteAlbums = async () => {
        try {
          const response = await fetch(`${encodeURI(catalogPath)}?v=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) return [];
          const parsed = await response.json();
          return Array.isArray(parsed) ? parsed.map(normalizeAlbum).filter(Boolean) : [];
        } catch {
          return [];
        }
      };

      const loadAlbums = async () => {
        const remoteAlbums = await loadRemoteAlbums();
        if (remoteAlbums.length) return remoteAlbums;
        return readAlbums().map(normalizeAlbum).filter(Boolean);
      };

      const resolvePath = (folder, file) => {
        const cleanFolder = String(folder || '').trim().replace(/\/+$/, '');
        const cleanFile = String(file || '').trim().replace(/^\/+/, '');
        return cleanFolder ? `${cleanFolder}/${cleanFile}` : cleanFile;
      };

      const escapeXml = (value) => String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const fallback = (title, subtitle, index) => {
        const palette = [
          ['#bfa785', '#2a2118'],
          ['#8a7c6b', '#151515'],
          ['#c2b9a2', '#26211c'],
          ['#a99a84', '#131313']
        ][index % 4];
        const safeTitle = escapeXml(title);
        const safeSubtitle = escapeXml(subtitle || 'Album');
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="${palette[0]}"/>
                <stop offset="100%" stop-color="${palette[1]}"/>
              </linearGradient>
            </defs>
            <rect width="1600" height="1000" fill="url(#g)"/>
            <rect width="1600" height="1000" fill="rgba(10,10,10,0.32)"/>
            <text x="80" y="860" fill="#f2eee8" font-family="Georgia, serif" font-size="84" font-style="italic">${safeTitle}</text>
            <text x="80" y="930" fill="#c8b89a" font-family="Montserrat, Arial, sans-serif" font-size="26" letter-spacing="6">${safeSubtitle}</text>
          </svg>
        `)}`;
      };

      const loadAlbumDetail = async (album) => {
        if (!album) return null;
        const candidates = [];
        if (album.folder) {
          candidates.push(resolvePath(album.folder, 'album.json'));
        }
        candidates.push(`Photo Albums/${album.id}/album.json`);

        for (const candidate of candidates) {
          try {
            const response = await fetch(`${encodeURI(candidate)}?v=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) continue;
            const parsed = await response.json();
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
              const detail = normalizeAlbum(parsed);
              return {
                ...album,
                ...(detail && detail.section ? { section: detail.section } : {}),
                ...(detail && detail.title ? { title: detail.title } : {}),
                ...(detail && detail.subtitle ? { subtitle: detail.subtitle } : {}),
                ...(detail && detail.folder ? { folder: detail.folder } : {}),
                ...(detail && detail.cover ? { cover: detail.cover } : {}),
                photos: Array.isArray(parsed.photos) ? parsed.photos.map(item => String(item || '').trim()).filter(Boolean) : album.photos,
              };
            }
          } catch {
            continue;
          }
        }

        return album;
      };

      const init = async () => {
        const catalog = await loadAlbums();
        const album = await loadAlbumDetail(catalog.find(item => item.id === albumId));
        if (!album) {
          document.title = 'Album not found';
          app.innerHTML = `
            <section class="not-found">
              <div class="not-found-card">
                <p class="album-kicker">Album not found</p>
                <h2>That album does not exist here.</h2>
                <p>The album may have been removed or the link is incomplete.</p>
                <p style="margin-top: 18px;"><a class="back-link" href="index.html">Back to home</a></p>
              </div>
            </section>
          `;
          return;
        }
        document.title = `${album.title} — Album`;

        const uniquePhotos = [];
        const seen = new Set();
        const paths = [album.cover || album.coverFile, ...(Array.isArray(album.photos) ? album.photos : [])];
        paths.forEach((file) => {
          const trimmed = String(file || '').trim();
          if (!trimmed) return;
          const fullPath = resolvePath(album.folder, trimmed);
          if (seen.has(fullPath)) return;
          seen.add(fullPath);
          uniquePhotos.push(fullPath);
        });

        app.innerHTML = `
          <div class="wrap">
            <div class="topbar">
              <div class="album-meta">
                <p class="album-kicker">${escapeXml(album.section)}</p>
                <h1>${escapeXml(album.title)}</h1>
                <p class="subtitle">${escapeXml(album.subtitle || '')}</p>
              </div>
              <a class="back-link" href="index.html#${encodeURIComponent(album.section)}">Back to section</a>
            </div>
            <section class="stage">
              <button class="nav-btn prev" type="button" aria-label="Previous photo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button class="nav-btn next" type="button" aria-label="Next photo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
              <div class="carousel">
                <div class="track" id="track">
                  ${uniquePhotos.map((src, index) => `
                    <figure class="slide">
                      <img src="${src}" alt="${escapeXml(album.title)} photo ${index + 1}">
                    </figure>
                  `).join('')}
                </div>
              </div>
            </section>
            <div class="bar">
              <p class="count" id="counter">1 / ${uniquePhotos.length || 1}</p>
              <div class="dots" id="dots"></div>
            </div>
          </div>
        `;

        if (!uniquePhotos.length) {
          const track = document.getElementById('track');
          track.innerHTML = `<div class="empty">No photos were attached to this album.</div>`;
          document.getElementById('dots').remove();
          document.getElementById('counter').textContent = '0 / 0';
          return;
        }

        const track = document.getElementById('track');
        const counter = document.getElementById('counter');
        const dots = document.getElementById('dots');
        const prev = document.querySelector('.nav-btn.prev');
        const next = document.querySelector('.nav-btn.next');
        const slides = Array.from(track.children);
        let current = 0;

        const renderDots = () => {
          dots.innerHTML = '';
          uniquePhotos.forEach((_, index) => {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = `dot${index === current ? ' active' : ''}`;
            dot.setAttribute('aria-label', `Go to photo ${index + 1}`);
            dot.addEventListener('click', () => {
              current = index;
              update();
            });
            dots.appendChild(dot);
          });
        };

        const update = () => {
          track.style.transform = `translateX(${-current * 100}%)`;
          counter.textContent = `${current + 1} / ${uniquePhotos.length}`;
          renderDots();
        };

        prev.addEventListener('click', () => {
          current = (current - 1 + uniquePhotos.length) % uniquePhotos.length;
          update();
        });
        next.addEventListener('click', () => {
          current = (current + 1) % uniquePhotos.length;
          update();
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowLeft') prev.click();
          if (event.key === 'ArrowRight') next.click();
        });

        slides.forEach((slide, index) => {
          const img = slide.querySelector('img');
          if (!img) return;
          img.addEventListener('error', () => {
            img.src = fallback(album.title, album.subtitle, index);
          }, { once: true });
        });

        update();
      };

      init();
    })();
  </script>
</body>
</html>
